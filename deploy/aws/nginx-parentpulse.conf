# Deployed to /etc/nginx/conf.d/parentpulse.conf on the EC2 instance.
# Serves the built React frontend as static files and reverse-proxies /api to the Node backend.
# __ORIGIN_SECRET__ is substituted by 05-deploy-app.sh with the value CloudFront sends.

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    root /opt/parentpulse/frontend/dist;
    index index.html;
    client_max_body_size 1m;

    # Only CloudFront knows this header value, so requests that bypass the CDN
    # (and therefore HTTPS) are refused.
    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Origin-Verify "";
    }

    # Hashed build assets never change - cache them for a year.
    location /assets/ {
        include /etc/nginx/parentpulse-security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # The app shell must be revalidated so a deploy shows up immediately.
    location = /index.html {
        include /etc/nginx/parentpulse-security-headers.conf;
        expires -1;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        include /etc/nginx/parentpulse-security-headers.conf;
        try_files $uri /index.html;
    }
}
