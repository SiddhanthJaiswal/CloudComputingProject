# Deployed to /etc/nginx/conf.d/parentpulse.conf on the EC2 instance.
# Serves the built React frontend as static files and reverse-proxies /api to the Node backend.

server {
    listen 80;
    server_name _;

    root /opt/parentpulse/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
